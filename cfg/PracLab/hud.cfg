// PracLab Practice HUD configuration
// Location: csgo/cfg/PracLab/hud.cfg
// Format: one ConVar per line as "key value"; lines starting with // are comments
// All thresholds are tick-granular (64-tick server: 1 tick ~= 15.6 ms, 128-tick: ~= 7.8 ms)

// —— Counter-strafe assessment (.strafe) ——
// Drop the record when a same-axis key switch takes longer than this many ticks (default 8 ~= 125 ms)
strafe_max_diff_ticks 8

// |diff| <= this many ticks counts as "Perfect" (default 0 = switch within the same tick)
strafe_perfect_ticks 0

// |diff| <= this many ticks counts as "Excellent" (default 1)
strafe_success_ticks 1

// Debounce: minimum ticks between records so one switch is not counted twice (default 4 ~= 62 ms)
strafe_debounce_ticks 4

// History cap for counter-strafe records (used by average diff / success rate / std dev / tendency)
strafe_history_limit 50

// —— Shot stability (.shot) ——
// History cap for samples
shot_history_limit 20

// Movement-key grace: shortly after pressing a move key is not judged as running fire (default 12 ~= 187 ms)
shot_grace_ticks 12

// Crouch release grace: shortly after releasing crouch still counts as crouch accuracy (default 3 ~= 47 ms)
shot_crouch_release_grace_ticks 3

// Crouch exit ramp: error recovers linearly over this many ticks after releasing crouch (default 6 ~= 94 ms)
shot_crouch_exit_ramp_ticks 6

// Stable threshold: speed_ratio normalized error <= this counts as stable (0.05-1.0)
shot_success_error_threshold 0.35

// Use the built-in per-weapon accuracy threshold table (AWP/snipers lower; false falls back to shot_default_threshold)
shot_weapon_thresholds_enabled true

// Default accuracy threshold for unlisted weapons (units/s; speed_ratio = horizontal speed / threshold)
shot_default_threshold 250

// —— Air strafe sync (.sync) ——
// History cap for recent air segments (used by average / best stats)
sync_history_limit 30

// —— Spray trace (.recoil) ——
// Reset the fire sequence when shots are spaced further apart than this many ticks (default 64 ~= 1 s)
recoil_reset_ticks 64

// Max recorded shots per fire sequence (overflow guard for full-auto)
recoil_max_shots_per_sequence 30

// Spray trace visualization: on the first shot a virtual board is anchored in front of the view;
// each tick the mouse movement (view-angle delta) is drawn as a world-space green beam polyline
// (pulling down extends the trace downward, side adjustments bend it sideways; no HUD panel, world space only)
recoil_beam_enabled true

// Trace scale: world units per degree of view-angle change (larger = longer trace)
recoil_trace_scale 2.5

// Distance from the player's eye to the trace board (world units)
recoil_trace_distance 80

// Max beam segments per trace (overflow guard)
recoil_trace_max_segments 256

// —— Push throttling ——
// HUD panel text push interval in ticks (delta-push only on change, default 2)
hud_push_interval_ticks 2
