// PracLab 练习 HUD 配置文件
// 放置位置：csgo/cfg/PracLab/hud.cfg
// 格式：每行一个 ConVar，空格分隔 key value，// 开头为注释
// 所有阈值以 tick 为粒度（64 tick 服务器 1 tick ≈ 15.6ms，128 tick ≈ 7.8ms）

// —— 急停评估（.strafe）——
// 同轴双键（A/D、W/S）切换差超过此 tick 数丢弃，不产生记录（默认 8 ≈ 125ms）
strafe_max_diff_ticks 8

// |差| ≤ 此 tick 数判「完美」（默认 0 = 同 tick 内完成切换）
strafe_perfect_ticks 0

// |差| ≤ 此 tick 数判「优秀」（默认 1）
strafe_success_ticks 1

// 防抖：两次记录最小间隔 tick 数，防止一次切换重复计入（默认 4 ≈ 62ms）
strafe_debounce_ticks 4

// 急停记录历史上限（用于统计平均差/成功率/标准差/趋势）
strafe_history_limit 50

// —— 开枪稳定（.shot）——
// 采样历史上限
shot_history_limit 20

// 移动键启动宽限：刚按下移动键的短时间内不判跑打（默认 12 ≈ 187ms）
shot_grace_ticks 12

// 下蹲释放宽限：松开蹲键后短时间内仍按蹲射精度判定（默认 3 ≈ 47ms）
shot_crouch_release_grace_ticks 3

// 下蹲退出坡道：松蹲后误差按坡道线性恢复（默认 6 ≈ 94ms）
shot_crouch_exit_ramp_ticks 6

// 稳定判定误差阈值（speed_ratio 归一化误差 ≤ 此值判成功，0.05-1.0）
shot_success_error_threshold 0.35

// 是否启用内置武器精度阈值表（AWP/狙击更低阈值等；false 时统一用 shot_default_threshold）
shot_weapon_thresholds_enabled true

// 未收录武器的默认精度阈值（units/s，speed_ratio = 实际水平速度 / 阈值）
shot_default_threshold 250

// —— 空中同步（.sync）——
// 近期空中段记录上限（用于均值/最佳统计）
sync_history_limit 30

// —— 弹道追踪（.recoil）——
// 射击间隔超过此 tick 数重置开火序列（默认 64 ≈ 1 秒）
recoil_reset_ticks 64

// 单个开火序列最大记录弹数（连发防溢出）
recoil_max_shots_per_sequence 30

// 压枪轨迹可视化：开火时在视线前方锚定虚拟画板，每 tick 视角差分绘制鼠标移动轨迹
// （压枪下拉 → 轨迹向下，左右修正 → 横向偏折；弹道追踪无 HUD 面板，轨迹仅此一处显示）
recoil_beam_enabled true

// 轨迹缩放：1 度视角变化映射的画板世界单位数（越大轨迹越长）
recoil_trace_scale 2.5

// 轨迹画板与玩家眼位的距离（世界单位）
recoil_trace_distance 80

// 单条轨迹最大 beam 段数（防溢出）
recoil_trace_max_segments 256

// —— 推送节流 ——
// HUD 面板文本推送间隔 tick 数（仅变化时差量推送，默认 2）
hud_push_interval_ticks 2
