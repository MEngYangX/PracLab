// PracLab plugin configuration
// Location: csgo/cfg/PracLab/config.cfg
// Format: one ConVar per line as "key value"; lines starting with // are comments

// Practice mode master switch (true/false)
// This is the default value; false disables .prac / .map / map switching entirely
praclab_enabled true

// Default language code (zh-CN / en)
praclab_default_language zh-CN
